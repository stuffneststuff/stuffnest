<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        // 1. Set your destination base URL (without query parameters)
        const baseUrl = "https://stuffnest.org/stuffchat.html";
        
        // 2. Grab the current query string (e.g., "?data=stuff")
        const queryParams = window.location.search;
        
        // 3. Combine them and redirect
        const finalUrl = baseUrl + queryParams;
        window.location.replace(finalUrl);
    </script>
</head>
<body>
    <p>Redirecting... <a id="fallback-link" href="https://stuffnest.org/stuffchat.html">Click here</a> if you are not redirected automatically.</p>

    <script>
        // Updates the fallback link with the query parameters too
        document.getElementById("fallback-link").href = finalUrl;
    </script>
</body>
</html>
