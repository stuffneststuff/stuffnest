<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Space VR Explorer</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Official Three.js Device Orientation Controls for flawless iPhone Gyro support -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,20,30,0.9) 0%, rgba(0,0,0,1) 100%);
            z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
            transition: opacity 0.5s ease;
        }
        
        .title-box {
            margin-bottom: 40px;
        }
        
        h1 {
            color: #0ff;
            text-transform: uppercase; letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            margin: 0 0 10px 0;
            font-size: 2.5rem;
        }
        
        p {
            color: #aaa; margin: 0; font-size: 1rem; letter-spacing: 1px;
        }

        .btn-container {
            display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
            max-width: 90%;
        }

        .action-btn {
            background: rgba(0, 20, 30, 0.5); 
            border: 2px solid #0ff;
            color: #0ff; padding: 15px 30px; font-size: 16px;
            text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,255,255,0.2), inset 0 0 10px rgba(0,255,255,0.1);
            transition: all 0.3s;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            backdrop-filter: blur(5px);
        }

        .action-btn:hover, .action-btn:active {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 25px rgba(0,255,255,0.6), inset 0 0 15px rgba(0,255,255,0.4);
            transform: scale(1.05);
        }

        .action-btn.vr-mode {
            border-color: #f0f;
            color: #f0f;
            box-shadow: 0 0 15px rgba(255,0,255,0.2), inset 0 0 10px rgba(255,0,255,0.1);
        }

        .action-btn.vr-mode:hover, .action-btn.vr-mode:active {
            background: rgba(255, 0, 255, 0.2);
            box-shadow: 0 0 25px rgba(255,0,255,0.6), inset 0 0 15px rgba(255,0,255,0.4);
        }
        
        #divider {
            position: absolute;
            top: 0; left: 50%; width: 2px; height: 100%;
            background: #222;
            display: none;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <div class="title-box">
            <h1>Starship OS</h1>
            <p>Select view mode to engage tracking</p>
        </div>
        <div class="btn-container">
            <button id="btn-360" class="action-btn">360 Fullscreen</button>
            <button id="btn-vr" class="action-btn vr-mode">Cardboard VR (Split)</button>
        </div>
    </div>
    
    <div id="divider"></div>

    <script>
        let scene, camera, renderer, stereoCamera;
        let cameraRig, crosshair;
        let deviceControls = null;
        let hudCanvas, hudTexture, hudMaterial;
        let isSplitScreen = false;
        
        let targets = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2(0, 0); // Always center for gaze
        
        // Interaction state
        let currentTarget = null;
        let gazeTime = 0;
        let isWarping = false;
        let warpTargetPos = new THREE.Vector3();
        let warpStartPos = new THREE.Vector3();
        let warpStartTime = 0;
        
        // Touch Drag Fallback for Desktop
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraRotation = { lon: 0, lat: 0 };

        // Initialize clock globally before animation loop starts
        const clock = new THREE.Clock();

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x010103);
            scene.fog = new THREE.FogExp2(0x010103, 0.001);

            // Main Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            
            // Stereo Camera for forced Cardboard Split Screen
            stereoCamera = new THREE.StereoCamera();
            stereoCamera.eyeSep = 0.064;

            // Camera Rig (acts as the ship's center, moves during warp)
            cameraRig = new THREE.Group();
            cameraRig.position.set(0, 0, 100); // Start far from sun
            scene.add(cameraRig);
            cameraRig.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            buildCockpit();
            buildHUD();
            buildCrosshair();

            const ambientLight = new THREE.AmbientLight(0x222222);
            scene.add(ambientLight);
            
            // The Sun Light
            const sunLight = new THREE.PointLight(0xffeedd, 3, 1000);
            sunLight.position.set(0, 0, 0);
            scene.add(sunLight);

            createStarfield();
            createSun();
            createPlanet('Terra Prime', 6, 0x2E86AB, new THREE.Vector3(60, 10, -40), true);
            createPlanet('Ares', 4.5, 0xD24116, new THREE.Vector3(-50, -15, -70), false);
            createGasGiant('Zeus', 16, new THREE.Vector3(120, 25, 60));
            createAsteroidBelt();

            window.addEventListener('resize', onWindowResize);
            
            // Desktop fallback dragging
            document.addEventListener('mousedown', () => isDragging = true);
            document.addEventListener('mouseup', () => isDragging = false);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('touchstart', (e) => { previousMousePosition = { x: e.touches[0].pageX, y: e.touches[0].pageY }; isDragging = true; });
            document.addEventListener('touchend', () => isDragging = false);
            document.addEventListener('touchmove', onTouchMove);

            // UI Buttons
            document.getElementById('btn-360').addEventListener('click', () => startExperience(false));
            document.getElementById('btn-vr').addEventListener('click', () => startExperience(true));
        }

        function createStarfield() {
            const starGeo = new THREE.BufferGeometry();
            const starCount = 4000;
            const starPos = new Float32Array(starCount * 3);
            const starColors = new Float32Array(starCount * 3);
            
            const color1 = new THREE.Color(0xffffff);
            const color2 = new THREE.Color(0x00ffff);
            const color3 = new THREE.Color(0xffa500);

            for(let i=0; i<starCount; i++) {
                // Spherical distribution
                const r = 400 + Math.random() * 600;
                const theta = 2 * Math.PI * Math.random();
                const phi = Math.acos(2 * Math.random() - 1);
                
                starPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
                starPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
                starPos[i*3+2] = r * Math.cos(phi);

                // Random colors
                const rand = Math.random();
                let c = color1;
                if(rand > 0.8) c = color2;
                if(rand > 0.95) c = color3;
                
                starColors[i*3] = c.r;
                starColors[i*3+1] = c.g;
                starColors[i*3+2] = c.b;
            }
            
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
            
            const starMat = new THREE.PointsMaterial({
                size: 1.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                sizeAttenuation: true
            });
            
            const stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);
        }

        function createSun() {
            const sunGroup = new THREE.Group();
            
            // Core
            const coreGeo = new THREE.SphereGeometry(25, 32, 32);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xFF8C00 });
            const sunCore = new THREE.Mesh(coreGeo, coreMat);
            sunGroup.add(sunCore);
            
            // Glow Aura (Additive blending)
            const glowGeo = new THREE.SphereGeometry(28, 32, 32);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0xffaa00,
                transparent: true,
                opacity: 0.4,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide
            });
            const sunGlow = new THREE.Mesh(glowGeo, glowMat);
            sunGroup.add(sunGlow);

            // Add to targets for gaze
            sunCore.userData = { name: 'Solaris Core', radius: 25 };
            targets.push(sunCore);

            scene.add(sunGroup);
        }

        function createPlanet(name, radius, colorHex, position, hasClouds) {
            const group = new THREE.Group();
            group.position.copy(position);

            // Base Planet
            const geo = new THREE.SphereGeometry(radius, 32, 32);
            const mat = new THREE.MeshStandardMaterial({ 
                color: colorHex,
                roughness: 0.8,
                metalness: 0.1
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.userData = { name: name, radius: radius };
            targets.push(mesh);
            group.add(mesh);

            // Clouds layer
            if (hasClouds) {
                const cloudGeo = new THREE.SphereGeometry(radius + 0.2, 32, 32);
                const cloudMat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.4,
                    roughness: 1.0,
                    blending: THREE.AdditiveBlending
                });
                const clouds = new THREE.Mesh(cloudGeo, cloudMat);
                // Simple rotation animation added in render loop based on name
                clouds.userData.isCloud = true; 
                group.add(clouds);
            }

            scene.add(group);
        }

        function createGasGiant(name, radius, position) {
            const group = new THREE.Group();
            group.position.copy(position);

            const geo = new THREE.SphereGeometry(radius, 32, 32);
            const mat = new THREE.MeshStandardMaterial({ color: 0xE59866, roughness: 0.5 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.userData = { name: name, radius: radius };
            targets.push(mesh);
            group.add(mesh);

            // Ring
            const ringGeo = new THREE.RingGeometry(radius * 1.3, radius * 2.2, 64);
            const ringMat = new THREE.MeshStandardMaterial({
                color: 0xFAD7A1,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.7
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2.5;
            group.add(ring);

            scene.add(group);
        }

        function createAsteroidBelt() {
            const beltCount = 600;
            const geo = new THREE.DodecahedronGeometry(1, 0);
            const mat = new THREE.MeshStandardMaterial({ color: 0x665544, roughness: 0.9 });
            
            // Using InstancedMesh for massive performance gain
            const mesh = new THREE.InstancedMesh(geo, mat, beltCount);
            const dummy = new THREE.Object3D();
            
            for(let i=0; i<beltCount; i++) {
                const r = 80 + Math.random() * 40;
                const theta = Math.random() * Math.PI * 2;
                const y = (Math.random() - 0.5) * 15;
                
                dummy.position.set(r * Math.cos(theta), y, r * Math.sin(theta));
                
                const scale = 0.5 + Math.random() * 1.5;
                dummy.scale.set(scale, scale, scale);
                
                dummy.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
                
                dummy.updateMatrix();
                mesh.setMatrixAt(i, dummy.matrix);
            }
            scene.add(mesh);
        }

        function buildCockpit() {
            // Glass Sphere / Wireframe Hologram look
            const geo = new THREE.IcosahedronGeometry(4, 2);
            const mat = new THREE.MeshBasicMaterial({
                color: 0x00aaff,
                wireframe: true,
                transparent: true,
                opacity: 0.15
            });
            const cockpit = new THREE.Mesh(geo, mat);
            
            // Floor disc
            const floorGeo = new THREE.CylinderGeometry(3, 3, 0.1, 32);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.y = -2;
            cockpit.add(floor);
            
            // Neon accent ring on floor
            const ringGeo = new THREE.RingGeometry(2.8, 2.9, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = -1.94;
            cockpit.add(ring);

            cameraRig.add(cockpit);
        }

        function buildHUD() {
            // Create 2D Canvas for dynamic text
            hudCanvas = document.createElement('canvas');
            hudCanvas.width = 512;
            hudCanvas.height = 256;
            
            hudTexture = new THREE.CanvasTexture(hudCanvas);
            hudMaterial = new THREE.MeshBasicMaterial({ map: hudTexture, transparent: true, side: THREE.DoubleSide });
            
            // Curved Dashboard Geometry
            const geo = new THREE.CylinderGeometry(2, 2, 0.8, 32, 1, true, -Math.PI/4, Math.PI/2);
            const dash = new THREE.Mesh(geo, hudMaterial);
            
            dash.position.set(0, -1.2, -1.5);
            dash.rotation.x = -0.2;
            
            cameraRig.add(dash);
            updateHUD("SYSTEM ONLINE\nGaze at a planet to warp.");
        }

        function updateHUD(text) {
            const ctx = hudCanvas.getContext('2d');
            ctx.clearRect(0, 0, 512, 256);
            
            // Background
            ctx.fillStyle = 'rgba(0, 30, 40, 0.7)';
            ctx.fillRect(0, 0, 512, 256);
            
            // Tech Borders
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 4;
            ctx.strokeRect(5, 5, 502, 246);
            
            // Text rendering
            ctx.fillStyle = '#00ffff';
            if (text.includes("WARP")) ctx.fillStyle = '#ff0055';
            
            ctx.font = 'bold 32px Orbitron';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const lines = text.split('\n');
            lines.forEach((line, i) => {
                ctx.fillText(line, 256, 128 + (i - (lines.length-1)/2) * 40);
            });
            
            hudTexture.needsUpdate = true;
        }

        function buildCrosshair() {
            const geo = new THREE.RingGeometry(0.02, 0.03, 32);
            const mat = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.8,
                depthTest: false // Render over everything
            });
            crosshair = new THREE.Mesh(geo, mat);
            crosshair.position.set(0, 0, -2); // Placed 2 meters directly in front of camera
            
            // CRITICAL: Crosshair must be attached to the camera, not the rig, 
            // so it follows head tracking perfectly in VR.
            camera.add(crosshair); 
        }

        function startExperience(splitScreen) {
            isSplitScreen = splitScreen;
            document.getElementById('start-overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('start-overlay').style.display = 'none', 500);

            if (isSplitScreen) {
                document.getElementById('divider').style.display = 'block';
            }

            // iOS 13+ Device Orientation Permission Protocol
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            initDeviceControls();
                        }
                    })
                    .catch(console.error);
            } else {
                // Non-iOS or older devices, try initializing immediately
                initDeviceControls();
            }
        }

        function initDeviceControls() {
            // Three.js DeviceOrientationControls for seamless mobile gyro
            if (THREE.DeviceOrientationControls) {
                deviceControls = new THREE.DeviceOrientationControls(camera);
            } else {
                console.warn("DeviceOrientationControls not found.");
            }
        }

        // Desktop Fallback Logic
        function onMouseMove(event) {
            if (!isDragging || deviceControls) return;
            const deltaX = event.clientX - previousMousePosition.x;
            const deltaY = event.clientY - previousMousePosition.y;
            previousMousePosition = { x: event.clientX, y: event.clientY };
            rotateCamera(deltaX, deltaY);
        }
        function onTouchMove(event) {
            if (!isDragging || deviceControls) return;
            const deltaX = event.touches[0].pageX - previousMousePosition.x;
            const deltaY = event.touches[0].pageY - previousMousePosition.y;
            previousMousePosition = { x: event.touches[0].pageX, y: event.touches[0].pageY };
            rotateCamera(deltaX, deltaY);
        }
        function rotateCamera(dx, dy) {
            cameraRotation.lon -= dx * 0.2;
            cameraRotation.lat -= dy * 0.2;
            cameraRotation.lat = Math.max(-85, Math.min(85, cameraRotation.lat));
            
            const phi = THREE.MathUtils.degToRad(90 - cameraRotation.lat);
            const theta = THREE.MathUtils.degToRad(cameraRotation.lon);
            
            const targetPosition = new THREE.Vector3();
            targetPosition.x = Math.sin(phi) * Math.cos(theta);
            targetPosition.y = Math.cos(phi);
            targetPosition.z = Math.sin(phi) * Math.sin(theta);
            
            camera.lookAt(targetPosition.add(camera.position));
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Update mobile gyro
            if (deviceControls) {
                deviceControls.update();
            }

            // Gaze Raycasting Engine
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(targets);

            if (intersects.length > 0 && !isWarping) {
                const hit = intersects[0].object;
                if (currentTarget !== hit) {
                    currentTarget = hit;
                    gazeTime = 0;
                    updateHUD(`TARGET LOCKED:\n${hit.userData.name}\nCalibrating...`);
                    crosshair.material.color.setHex(0xff0055);
                }
                
                gazeTime += delta;
                
                // Animate crosshair shrinking to indicate charge
                const scale = Math.max(0.2, 1 - (gazeTime / 2));
                crosshair.scale.set(scale, scale, 1);
                
                if (gazeTime > 2.0) {
                    initiateWarp(hit);
                }
            } else if (!isWarping) {
                if (currentTarget !== null) {
                    updateHUD("SYSTEM ONLINE\nGaze at a planet to warp.");
                    crosshair.material.color.setHex(0x00ffff);
                }
                currentTarget = null;
                gazeTime = 0;
                crosshair.scale.set(1, 1, 1); // Reset scale
            }

            // Warp Animation Logic
            if (isWarping) {
                const now = performance.now();
                const progress = Math.min((now - warpStartTime) / 2500, 1);
                
                // Ease in out cubic function for smooth acceleration/deceleration
                const easeT = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;
                
                cameraRig.position.lerpVectors(warpStartPos, warpTargetPos, easeT);
                
                // Hyperspace FOV Stretch Effect
                camera.fov = 75 + Math.sin(progress * Math.PI) * 40;
                camera.updateProjectionMatrix();
                
                if (progress >= 1) {
                    isWarping = false;
                    updateHUD(`ORBIT ACHIEVED\n${currentTarget.userData.name}`);
                    camera.fov = 75;
                    camera.updateProjectionMatrix();
                }
            }

            // Slowly rotate scene elements for life
            scene.children.forEach(child => {
                if (child.userData && child.userData.isCloud) {
                    child.rotation.y += delta * 0.02;
                }
            });

            // Render Pipeline (Standard vs Split Screen VR)
            if (isSplitScreen) {
                renderStereo();
            } else {
                renderer.render(scene, camera);
            }
        }

        function initiateWarp(targetMesh) {
            isWarping = true;
            crosshair.scale.set(1, 1, 1);
            
            // Calculate destination stopping distance based on planet size
            warpTargetPos.copy(targetMesh.position);
            const direction = warpTargetPos.clone().sub(cameraRig.position).normalize();
            
            // Stop 3x the radius away from the planet's center
            const stoppingDist = targetMesh.userData.radius * 3.5 + 5; 
            warpTargetPos.sub(direction.multiplyScalar(stoppingDist));
            
            warpStartPos.copy(cameraRig.position);
            warpStartTime = performance.now();
            
            updateHUD(`>>> WARP DRIVE ACTIVE <<<\nDestination: ${targetMesh.userData.name}`);
        }

        // Removed the clock definition from here (it is now at the top of the script)

        // Forced Stereoscopic Rendering function (GUARANTEES VR Split view)
        function renderStereo() {
            stereoCamera.update(camera);
            
            const size = new THREE.Vector2();
            renderer.getSize(size);
            
            renderer.setScissorTest(true);
            
            // Render Left Eye
            renderer.setScissor(0, 0, size.width / 2, size.height);
            renderer.setViewport(0, 0, size.width / 2, size.height);
            renderer.render(scene, stereoCamera.cameraL);
            
            // Render Right Eye
            renderer.setScissor(size.width / 2, 0, size.width / 2, size.height);
            renderer.setViewport(size.width / 2, 0, size.width / 2, size.height);
            renderer.render(scene, stereoCamera.cameraR);
            
            renderer.setScissorTest(false);
        }
    </script>
</body>
</html>
