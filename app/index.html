<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stuffnest App Hub</title>
    
    <!-- PWA Manifest & iOS Icons -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="https://i.imgur.com/5JyEp5I.png">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .instruction-box {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col items-center justify-center min-h-screen p-4 font-sans">

    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full text-center">
        <img src="https://i.imgur.com/5JyEp5I.png" alt="App Icon" class="w-24 h-24 mx-auto mb-4 rounded-2xl shadow-sm">
        
        <h1 id="app-title" class="text-2xl font-bold mb-2">Stuffnest Hub</h1>
        <p class="text-gray-500 mb-6 text-sm">Install this application to your home screen for a seamless, full-screen native experience.</p>
        
        <button id="install-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl transition duration-200 shadow-md">
            Install Application
        </button>

        <!-- iOS Instructions (Hidden by default) -->
        <div id="ios-instructions" class="instruction-box mt-6 bg-blue-50 border border-blue-200 p-4 rounded-xl text-left">
            <h3 class="font-bold text-blue-800 mb-2">📱 Apple iOS Instructions</h3>
            <ol class="list-decimal list-inside text-sm text-blue-900 space-y-2">
                <li>Tap the <strong>Share</strong> icon <span class="bg-white border px-1 rounded">⍐</span> at the bottom.</li>
                <li>Scroll down and tap <strong>Add to Home Screen</strong> <span class="bg-white border px-1 rounded">+</span>.</li>
                <li>Tap <strong>Add</strong> in the top right.</li>
            </ol>
        </div>
    </div>

    <script>
        // 1. Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg.scope))
                    .catch(err => console.error('Service Worker Failed:', err));
            });
        }

        // 2. Hash Routing & App Naming
        const appTitle = document.getElementById('app-title');
        const hash = window.location.hash.replace('#', '');
        if (hash) {
            appTitle.textContent = hash.charAt(0).toUpperCase() + hash.slice(1);
        }

        // 3. Installation Logic & Device Detection
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');
        const iosBox = document.getElementById('ios-instructions');
        
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
        const isChromeOS = /\bCrOS\b/.test(userAgent);

        // Capture the native install prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        installBtn.addEventListener('click', async () => {
            // iOS doesn't support programmatic install, show manual instructions
            if (isIOS) {
                installBtn.style.display = 'none';
                iosBox.style.display = 'block';
                return;
            }

            // The specific Chrome OS alert you requested
            if (isChromeOS) {
                alert("To install this app on Chrome OS, click the install icon in your address bar or open the Chrome menu (⋮) and select 'Install App'.");
                return;
            }

            // Android/Desktop Native Install Prompt
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('App installed successfully');
                }
                deferredPrompt = null;
            } else {
                // Fallback for browsers that block the prompt
                alert("To install, please check your browser address bar for an install icon, or use your browser's menu to 'Add to Home Screen'.");
            }
        });

        // Standalone Mode Redirect
        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
            // Redirect to a specific link if opened as an installed app
            // window.location.href = "https://your-target-link.com";
            console.log("Running in standalone mode");
        }
    </script>
</body>
</html>
